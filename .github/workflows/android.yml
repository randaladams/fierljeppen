name: Android build

# Builds a debug APK on every push to main and publishes it on the
# "latest" release, so it can be downloaded straight from a phone:
#   https://github.com/randaladams/fierljeppen/releases/tag/latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_TAG }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          curl -sSL -o godot.zip "${base}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -sSL -o templates.tpz "${base}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 godot
          chmod +x godot

      - name: Install Godot, templates and editor settings
        run: |
          sudo ln -sf ~/godot-dl/godot /usr/local/bin/godot
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          unzip -q -o ~/godot-dl/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tdir"/
          ls "$tdir" | grep -i android
          mkdir -p ~/.config/godot
          short="${GODOT_VERSION%.*}"
          for f in editor_settings-${short}.tres editor_settings-4.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/signing/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Physics tests
        run: godot --headless --path . -s res://tests/test_pole_sim.gd

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/signing/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/fierljeppen.apk 2>&1 | tee export.log
          test -s build/fierljeppen.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: fierljeppen-debug-apk
          path: build/fierljeppen.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/fierljeppen.apk \
            --prerelease \
            --title "Latest debug build (#${GITHUB_RUN_NUMBER})" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. On your phone: download fierljeppen.apk, open it, and allow installs from this source when Android asks."
